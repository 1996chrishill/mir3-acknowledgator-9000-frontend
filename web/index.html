<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <title>MIR3 Ack</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7d5b'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>MIR3 Ack</h1>
    <div class="badges">
      <span id="dry" class="badge warn" hidden>DRY RUN</span>
      <span id="conn" class="badge">…</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" role="tab" data-tab="pending">Pending <span id="count" class="pill">–</span></button>
    <button class="tab" role="tab" data-tab="history">History</button>
  </nav>

  <main>
    <section id="tab-pending">
      <div class="toolbar">
        <button id="ackAll" class="primary" data-lock>Ack all</button>
        <button id="refresh" data-lock>Refresh</button>
      </div>
      <div id="auto" class="card auto">
        <div class="body">
          <div class="row"><span class="inc">Auto-ack</span><span id="autoTag" class="tag">…</span></div>
          <div id="autoInfo" class="sub"></div>
        </div>
        <button id="autoToggle" disabled>Start</button>
      </div>
      <p id="status" class="status"></p>
      <div id="result" hidden></div>
      <ul id="pending" class="list"><li class="empty">Loading…</li></ul>
    </section>

    <section id="tab-history" hidden>
      <div class="toolbar">
        <button id="refreshHist">Refresh</button>
      </div>
      <p id="histStatus" class="status"></p>
      <ul id="history" class="list"></ul>
    </section>
  </main>
</body>
</html>
